<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>my-icon.shop — Premium 3D Custom Apparel</title>
    <meta name="description" content="Design custom apparel in real-time 3D. Premium quality printing with cutting-edge technology." />

    <!-- Favicon — all major platforms -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Android / PWA icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png" />

    <!-- Browser tab / taskbar theme colour -->
    <meta name="theme-color" content="#6366F1" />
    <meta name="msapplication-TileColor" content="#6366F1" />
    <meta name="msapplication-TileImage" content="/favicon-192x192.png" />

    <!-- Open Graph (social share preview icon) -->
    <meta property="og:title" content="my-icon.shop — Premium 3D Custom Apparel" />
    <meta property="og:description" content="Design custom apparel in real-time 3D." />
    <meta property="og:image" content="/favicon-512x512.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Firebase Realtime Database -->
    <link rel="preconnect" href="https://firebaseio.com" />
    <link rel="dns-prefetch" href="https://firebaseio.com" />
    <link rel="preconnect" href="https://firebase.googleapis.com" />
    <link rel="dns-prefetch" href="https://firebase.googleapis.com" />
    <!-- External image CDNs used at runtime -->
    <link rel="dns-prefetch" href="https://flagcdn.com" />
  </head>
  <body class="bg-primary text-white font-body antialiased">
    <div id="root">
      <!-- Static spinner shown before React boots. Removed automatically when React mounts. -->
      <div id="html-loader" style="
        position:fixed;inset:0;background:#0A0E27;
        display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:9999;
      ">
        <div style="position:relative;width:52px;height:52px;">
          <div style="position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,255,255,0.07);"></div>
          <div style="
            position:absolute;inset:0;border-radius:50%;
            border:2px solid transparent;
            border-top-color:#6366F1;border-right-color:rgba(99,102,241,0.25);
            animation:spin .75s linear infinite;
          "></div>
        </div>
        <span style="color:rgba(255,255,255,0.45);font-size:13px;letter-spacing:0.04em;font-family:sans-serif;">
          Loading 3D model&hellip;
        </span>
      </div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
